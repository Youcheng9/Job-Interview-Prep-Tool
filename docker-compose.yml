services:
  db:
    image: postgres:16
    container_name: interviewprep-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interviewprep-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@db:5432/interviewprep
      CORS_ALLOW_ORIGINS: http://localhost:3000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_hf_cache:/root/.cache/huggingface
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewprep-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

  ollama:
    image: ollama/ollama:latest
    container_name: interviewprep-ollama
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ollama_data:/root/.ollama

volumes:
  backend_hf_cache:
  postgres_data:
  frontend_node_modules:
  ollama_data:
